version: '3.8'

services:

  # ── Banco de dados ───────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: compia_db
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - compia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (opcional, remova em prod se quiser) ─────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: compia_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@compia.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ── Backend .NET ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compia_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5260

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      Jwt__Key:      ${JWT_KEY}
      Jwt__Issuer:   CompiaBackend
      Jwt__Audience: CompiaFrontend

      Email__SmtpHost:    ${EMAIL_HOST}
      Email__SmtpPort:    ${EMAIL_PORT}
      Email__Username:    ${EMAIL_USERNAME}
      Email__Password:    ${EMAIL_PASSWORD}
      Email__SenderName:  ${EMAIL_SENDER_NAME}
      Email__SenderEmail: ${EMAIL_SENDER_EMAIL}

      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD}

      MelhorEnvio__Token: ${MELHORENVIO_TOKEN}

      Correios__CepOrigem:       ${CORREIOS_CEP_ORIGEM}
      Correios__CartaoPostagem:  ${CORREIOS_CARTAO_POSTAGEM:-}
      Correios__Senha:           ${CORREIOS_SENHA:-}
    volumes:
      - compia_pdfs:/app/uploads/pdfs

  # ── Frontend + Nginx ─────────────────────────────────────────
  frontend:
    build:
      context: ../compia-bookstore-app
      dockerfile: Dockerfile
    container_name: compia_frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  compia_data:
  compia_pdfs: